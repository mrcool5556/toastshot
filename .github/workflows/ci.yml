# Builds and tests every push and pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      # Tests that need a real desktop session (clipboard, screen capture, the video encoder) run locally only.
      - run: dotnet test Toastshot.sln -c Release --filter "Needs!=Desktop"
